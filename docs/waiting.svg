<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
<title id="t">Requests that wait 200 ms</title>
<desc id="d">100 connections: wo-adaptor-jetty 487, classic adaptor 489 requests per second; 1000 connections: wo-adaptor-jetty 4,837, classic adaptor 1,220 requests per second; 2000 connections: wo-adaptor-jetty 9,717, classic adaptor 1,147 requests per second</desc>
<style>
